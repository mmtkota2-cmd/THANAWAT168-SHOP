
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THANAWAT168 SHOP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shop">
    <nav class="navbar">
      <div class="logo">THANAWAT168 SHOP</div>
      <div class="nav-links" id="navLinks">
        <a href="#home">หน้าหลัก</a>
        <a href="#categories">หมวดหมู่</a>
        <a href="#contact">ติดต่อเรา</a>
      </div>

    <header class="hero" id="home">

    <main id="categories">
      <h2>หมวดหมู่สินค้า</h2>

          <span>💳</span>

        <button class="category" data-category="เติมเกม">

          <strong>เติมเกม</strong>
          <small>เกมที่คุณชื่นชอบ</small>
        </button>
        <button class="category" data-category="แอป Android">
          <span>📱</span>
          <strong>แอป Android</strong>
          <small>สินค้าและบริการ</small>
        </button>
      </div>
      <p id="message">เลือกหมวดหมู่ที่คุณสนใจ</p>
    </main>

    <footer id="contact">
      ติดต่อร้านค้า: Ig : thanxwxt_

  </div>
  <script src="script.js"></script>
</body>
</html>
